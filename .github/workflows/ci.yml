name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test suite
        run: python -m pytest tests/ -q

      # The governance gates. These are the drift detectors the design docs
      # rely on; before this workflow existed nothing re-ran them.
      - name: M1 feature-registry drift gate
        run: python scripts/check_feature_registry.py

      - name: N1 taxonomy coverage gate
        run: python scripts/check_n1_taxonomy_coverage.py
