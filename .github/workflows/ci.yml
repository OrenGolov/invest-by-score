name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test suite
        run: python -m pytest tests/ -q

      # The governance gates. These are the drift detectors the design docs
      # rely on; before this workflow existed nothing re-ran them.
      - name: M1 feature-registry drift gate
        run: python scripts/check_feature_registry.py

      - name: N1 taxonomy coverage gate
        run: python scripts/check_n1_taxonomy_coverage.py

      - name: M2 training-dataset drift gate
        run: python scripts/check_training_dataset.py

      - name: M2 model-registry drift gate
        run: python scripts/check_model_registry.py

      - name: M3 trial-registry drift gate
        run: python scripts/check_trial_registry.py

      - name: M3 training-pipeline drift gate
        run: python scripts/check_training_pipeline.py

      - name: M4 baseline-suite drift gate
        run: python scripts/check_baseline_suite.py

      - name: M6 calibration drift gate
        run: python scripts/check_calibration.py

      - name: M8 reproducibility drift gate
        run: python scripts/check_reproducibility.py

      - name: E1 event-contract drift gate
        run: python scripts/check_event_contract.py

      - name: E2 entity-resolution drift gate
        run: python scripts/check_entity_resolution.py

      - name: E3 actor-intelligence drift gate
        run: python scripts/check_actor_intelligence.py
