<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Score</title>
  <style>
    :root {
      --bg: #071827;
      --bg-deep: #020b14;
      --panel: #0f1f2d;
      --panel-alt: #122738;
      --panel-soft: #18314a;
      --text: #eaf4ff;
      --muted: #9bb0c7;
      --accent: #5aa8ff;
      --accent-2: #7ce3c3;
      --warning: #ffbf69;
      --danger: #ff7a7a;
      --border: rgba(124, 158, 196, 0.22);
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      width: min(1200px, 100%);
      margin: 0 auto;
      background: rgba(15, 31, 45, 0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 40px var(--shadow);
      padding: 24px;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(1.8rem, 2vw, 2.5rem);
    }
    .controls {
      display: grid;
      grid-template-columns: 1.2fr 1.2fr auto;
      gap: 14px;
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    input, button {
      width: 100%;
      height: 46px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      color: var(--text);
      font-size: 1rem;
      padding: 0 12px;
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #3d7af5);
      border: none;
      color: white;
      font-weight: 700;
      transition: transform 0.15s ease;
    }
    button:hover { transform: translateY(-1px); }
    .status {
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 16px;
      margin: 18px 0 24px;
    }
    .card {
      background: linear-gradient(180deg, var(--panel-alt), var(--panel));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 110px;
    }
    .card .label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .card .value {
      font-size: clamp(1.2rem, 2vw, 2rem);
      font-weight: 700;
    }
    .card .sub {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 6px;
    }
    .score-good { color: var(--accent-2); }
    .score-warn { color: var(--warning); }
    .score-bad { color: var(--danger); }
    .layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .panel {
      background: rgba(12, 25, 38, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .panel h2 {
      margin: 0 0 14px;
      font-size: 1.1rem;
    }
    .recommendation-list,
    .list,
    .source-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .recommendation-item,
    .source-item,
    .insight-item {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .tag {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.72rem;
      font-weight: 700;
      background: rgba(95, 168, 255, 0.12);
      color: var(--accent);
      margin-right: 8px;
      vertical-align: middle;
    }
    .strong { font-weight: 700; }
    ul {
      margin: 0;
      padding-left: 18px;
    }
    li { margin: 8px 0; color: var(--text); }
    .muted { color: var(--muted); }
    .metric-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .metric-row:last-child { border-bottom: none; }
    .full-width {
      grid-column: 1 / -1;
    }
    .health-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .health-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .health-card .metric {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 10px 0;
    }
    .chart-shell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
    }
    .chart-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .mini-stat {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    th, td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.72rem;
    }
    /* --- Navigation ------------------------------------------------------ */
    .tabs {
      display: flex;
      gap: 6px;
      margin: 0 0 18px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tab {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 10px 14px;
      width: auto;
      height: auto;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tab .count {
      background: rgba(90, 168, 255, 0.18);
      border-radius: 10px;
      font-size: 0.72rem;
      margin-left: 6px;
      padding: 1px 7px;
    }
    .page { display: none; }
    .page.active { display: block; }

    /* --- Monitoring filters ---------------------------------------------- */
    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .filters select, .filters input {
      height: 42px;
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0 10px;
      width: 100%;
      font-size: 0.9rem;
    }
    .filters .wide { grid-column: 1 / -1; }
    .filter-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-actions button {
      width: auto;
      padding: 0 16px;
      height: 38px;
    }
    .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.78rem;
      padding: 5px 12px;
      width: auto;
      height: auto;
    }
    .chip.on { color: var(--text); border-color: currentColor; }
    .chip .dot {
      border-radius: 50%;
      display: inline-block;
      height: 8px;
      margin-right: 6px;
      width: 8px;
    }

    /* --- Alert cards ----------------------------------------------------- */
    /* Priority colours, matching core.config.ALERT_PRIORITY_COLOURS so the
       dashboard and an email never disagree about what Urgent looks like. */
    .p-urgent   { --band: #ff5252; }
    .p-veryhigh { --band: #ff9e3d; }
    .p-high     { --band: #ffd43b; }
    .p-medium   { --band: #4dabf7; }
    .p-low      { --band: #cfd8e3; }
    .p-none     { --band: #78889c; }

    .alert-card {
      background: var(--panel-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--band, var(--muted));
      border-radius: 10px;
      margin-bottom: 8px;
      overflow: hidden;
    }
    .alert-head {
      align-items: center;
      cursor: pointer;
      display: grid;
      gap: 10px;
      grid-template-columns: auto auto 1fr auto auto;
      padding: 12px 14px;
    }
    .alert-head:hover { background: var(--panel-soft); }
    .badge {
      background: var(--band, var(--muted));
      border-radius: 6px;
      color: #08121c;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .alert-ticker {
      font-weight: 800;
      font-size: 0.95rem;
      min-width: 56px;
    }
    .alert-title { font-size: 0.95rem; }
    .alert-when {
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .caret { color: var(--muted); font-size: 0.8rem; }
    .alert-body {
      border-top: 1px solid var(--border);
      display: none;
      padding: 14px;
    }
    .alert-card.open .alert-body { display: block; }
    .alert-body dl {
      display: grid;
      grid-template-columns: minmax(110px, auto) 1fr;
      gap: 6px 14px;
      margin: 0;
    }
    .alert-body dt {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .alert-body dd { margin: 0; font-size: 0.88rem; line-height: 1.5; }
    .alert-body .block { margin-top: 12px; }
    .alert-body ul { margin: 4px 0 0; padding-left: 18px; font-size: 0.88rem; }
    .alert-body li { line-height: 1.5; margin-bottom: 3px; }
    .action-pill {
      background: rgba(124, 227, 195, 0.16);
      border: 1px solid rgba(124, 227, 195, 0.4);
      border-radius: 6px;
      color: var(--accent-2);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 2px 9px;
    }
    .empty {
      border: 1px dashed var(--border);
      border-radius: 10px;
      color: var(--muted);
      padding: 28px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .summary-grid, .layout {
        grid-template-columns: 1fr 1fr;
      }
      .controls {
        grid-template-columns: 1fr;
      }
    }
    /* The feed must stay readable on a phone: the head collapses to two rows
       and the timestamp moves under the title rather than being truncated. */
    @media (max-width: 620px) {
      .alert-head {
        grid-template-columns: auto 1fr auto;
        row-gap: 4px;
      }
      .alert-title { grid-column: 1 / -1; }
      .alert-when { grid-column: 1 / -1; white-space: normal; }
      .alert-body dl { grid-template-columns: 1fr; gap: 2px; }
      .alert-body dt { margin-top: 8px; }
    }
    @media (max-width: 640px) {
      .summary-grid, .layout {
        grid-template-columns: 1fr;
      }
      body { padding: 14px; }
      .container { padding: 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Investment Score</h1>

    <nav class="tabs">
      <button class="tab active" data-page="score">Score</button>
      <button class="tab" data-page="monitoring">Monitoring<span class="count" id="alertCount"></span></button>
    </nav>

    <section class="page active" id="page-score">
    <div class="controls">
      <div>
        <label for="ticker">Ticker</label>
        <input id="ticker" type="text" value="MSFT" />
      </div>
      <div>
        <label for="date">Date</label>
        <input id="date" type="date" />
      </div>
      <div>
        <label>&nbsp;</label>
        <button id="submit">Get score</button>
      </div>
    </div>

    <div class="status" id="status">Default date is today.</div>

    <div id="output"></div>
    </section>

    <section class="page" id="page-monitoring">
      <div class="filters">
        <input id="fSearch" class="wide" type="search"
               placeholder="Search ticker, title, reason&hellip;" />
        <input id="fTicker" type="text" list="tickerList"
               placeholder="Ticker (e.g. NVDA)" />
        <datalist id="tickerList"></datalist>
        <select id="fType"><option value="">All event types</option></select>
        <input id="fStart" type="date" title="From" />
        <input id="fEnd" type="date" title="To" />
      </div>
      <div class="filter-actions">
        <div class="chip-row" id="priorityChips"></div>
        <button id="fClear">Clear</button>
      </div>
      <div class="status" id="alertStatus">Loading alerts&hellip;</div>
      <div id="alertFeed"></div>
    </section>
  </div>

  <script>
    const tickerInput = document.getElementById('ticker');
    const dateInput = document.getElementById('date');
    const output = document.getElementById('output');
    const status = document.getElementById('status');
    const submitBtn = document.getElementById('submit');

    function setToday() {
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      dateInput.value = value;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderList(items, fallback = 'None') {
      if (!items || !items.length) return `<div class="muted">${fallback}</div>`;
      return '<ul>' + items.map(item => `<li>${escapeHtml(item)}</li>`).join('') + '</ul>';
    }

    function renderMetricRows(obj) {
      if (!obj || typeof obj !== 'object') return '<div class="muted">No metrics available.</div>';
      return Object.entries(obj).map(([key, value]) => `
        <div class="metric-row">
          <span class="muted">${escapeHtml(key.replace(/_/g, ' '))}</span>
          <span class="strong">${escapeHtml(String(value))}</span>
        </div>
      `).join('');
    }

    // Macro context rows pinned to the TOP of the weights panel. These are
    // macro SERIES (inputs to the macroeconomic agent), not ensemble agents —
    // they carry no weight of their own, so they render as context with an
    // explicit status rather than a number that looks like a weight.
    const PINNED_MACRO_SERIES = [
      { key: 'vix', label: 'VIX', note: 'implied volatility — inverted: high = risk-off' },
      { key: '10y_yield', label: '10Y Treasury Yield', note: 'long rate' },
      { key: '30y_yield', label: '30Y Treasury Yield', note: 'ultra-long rate / term premium' },
    ];

    function renderPinnedMacroRows(agentOutputs = []) {
      const macro = (agentOutputs || []).find(a => a && a.agent === 'macroeconomic');
      const payload = (macro && macro.payload) || {};
      const values = payload.series_values || {};
      const status = macro ? macro.status : 'UNAVAILABLE';
      return PINNED_MACRO_SERIES.map(series => {
        const raw = values[series.key];
        const shown = (raw === undefined || raw === null)
          ? `<span class="muted">${escapeHtml(status)}</span>`
          : `<span class="strong">${escapeHtml(String(raw))}</span>`;
        return `
        <div class="metric-row">
          <span class="muted">${escapeHtml(series.label)}<br><small class="muted">${escapeHtml(series.note)}</small></span>
          ${shown}
        </div>`;
      }).join('');
    }

    function renderWeightRows(weights, agents, horizon = 'current') {
      if (!weights || typeof weights !== 'object' || !Object.keys(weights).length) {
        return '<div class="muted">No ensemble weights available.</div>';
      }
      // Heaviest first, so the agent actually carrying the score reads first.
      const ordered = Object.entries(weights).sort((a, b) => Number(b[1]) - Number(a[1]));
      return ordered.map(([agent, weight]) => {
        const line = (agents || {})[agent] || {};
        const status = line.status ? String(line.status) : '';
        const pct = (Number(weight) * 100).toFixed(1);
        const effective = horizon === 'long'
          ? line.effective_weight_long
          : line.effective_weight_current;
        const effNote = (effective !== undefined && effective !== null && Number(effective) !== Number(weight))
          ? ` <small class="muted">(effective ${(Number(effective) * 100).toFixed(1)}%)</small>`
          : '';
        return `
        <div class="metric-row">
          <span class="muted">${escapeHtml(agent.replace(/_/g, ' '))}${status ? ` <small class="muted">[${escapeHtml(status)}]</small>` : ''}</span>
          <span class="strong">${pct}%${effNote}</span>
        </div>`;
      }).join('');
    }

    function renderRecommendationOptions(options = []) {
      if (!options.length) return '<div class="muted">No recommendation options available.</div>';
      return options.map(option => `
        <div class="recommendation-item">
          <div>
            <span class="tag">${option.status ? 'Selected' : 'Option'}</span>
            <span class="strong">${escapeHtml(option.label)}</span>
          </div>
          <div class="muted" style="margin-top: 8px;">Confidence: ${Number(option.confidence_pct ?? 0).toFixed(1)}%</div>
        </div>
      `).join('');
    }

    function renderSourceList(sources = []) {
      if (!sources.length) return '<div class="muted">No source metadata available.</div>';
      return sources.map(source => `
        <div class="source-item">
          <div><span class="strong">${escapeHtml(source.name)}</span></div>
          <div class="muted">Reliability: ${(Number(source.reliability_score ?? 0) * 100).toFixed(0)}%</div>
          <div class="muted">${escapeHtml(source.coverage ?? '')}</div>
        </div>
      `).join('');
    }

    function renderConfidenceNote(breakdown) {
      if (!breakdown || !Array.isArray(breakdown.factors) || !breakdown.factors.length) {
        return { text: 'Model confidence', full: '' };
      }
      const sortedFactors = [...breakdown.factors].sort((a, b) => Number(a.value ?? 0) - Number(b.value ?? 0));
      const weakest = sortedFactors[0];
      const penalties = Array.isArray(breakdown.penalties) ? breakdown.penalties : [];
      const factorSummary = `${weakest.name} ${Math.round(Number(weakest.value ?? 0) * 100)}%`;
      const penaltySummary = penalties.length
        ? `, ${penalties.length} penalt${penalties.length === 1 ? 'y' : 'ies'}`
        : '';
      const detail = [
        ...breakdown.factors.map(f => `${f.name}: ${Math.round(Number(f.value ?? 0) * 100)}% (weight ${f.weight})`),
        ...penalties.map(p => `penalty: ${p.name} −${p.magnitude}`),
      ];
      return {
        text: `evidence-based · weakest: ${factorSummary}${penaltySummary}`,
        full: detail.join(' | '),
      };
    }

    function render(data) {
      const decision = data?.data || data;
      const score = Number(decision.score ?? 0);
      const currentScore = Number(decision.current_time_score ?? decision.score ?? 0);
      const longTermScore = Number(decision.long_term_score ?? decision.score ?? 0);
      const confidence = Number(decision.confidence ?? 0) * 100;
      const primaryAction = decision.recommended_actions?.primary || decision.action || 'ANALYSIS_ONLY';
      const scoreClass = score >= 7 ? 'score-good' : score >= 4 ? 'score-warn' : 'score-bad';
      const currentClass = currentScore >= 7 ? 'score-good' : currentScore >= 4 ? 'score-warn' : 'score-bad';
      const longTermClass = longTermScore >= 7 ? 'score-good' : longTermScore >= 4 ? 'score-warn' : 'score-bad';
      const vetoReasons = Array.isArray(decision.veto_reasons) ? decision.veto_reasons : [];
      const confNote = renderConfidenceNote(decision.confidence_breakdown);

      const summary = `
        <div class="panel full-width">
          <h2>Decision State</h2>
          <div class="metric-row"><span class="muted">Mode</span><span class="strong">${escapeHtml(decision.mode || 'ANALYSIS_ONLY')}</span></div>
          <div class="metric-row"><span class="muted">Action</span><span class="strong">${escapeHtml(decision.action || primaryAction)}</span></div>
          <div class="metric-row"><span class="muted">Decision type</span><span class="strong">${escapeHtml(decision.decision_type || 'score')}</span></div>
          <div class="metric-row"><span class="muted">Replay hash</span><span class="strong">${escapeHtml(decision.replay_hash || 'N/A')}</span></div>
          <div style="margin-top: 12px;"><strong>Veto reasons:</strong> ${vetoReasons.length ? renderList(vetoReasons) : '<span class="muted">None</span>'}</div>
        </div>

        <div class="summary-grid">
          <div class="card">
            <div class="label">Ticker</div>
            <div class="value">${escapeHtml(decision.ticker || 'N/A')}</div>
            <div class="sub">${escapeHtml(decision.as_of || 'N/A')}</div>
          </div>
          <div class="card">
            <div class="label">Current</div>
            <div class="value ${currentClass}">${Number(currentScore).toFixed(2)}/10</div>
            <div class="sub">Short-term / news-driven</div>
          </div>
          <div class="card">
            <div class="label">Long term</div>
            <div class="value ${longTermClass}">${Number(longTermScore).toFixed(2)}/10</div>
            <div class="sub">150d / 200d trend</div>
          </div>
          <div class="card">
            <div class="label">Final</div>
            <div class="value ${scoreClass}">${Number(score).toFixed(2)}/10</div>
            <div class="sub">Blended score</div>
          </div>
          <div class="card">
            <div class="label">Confidence</div>
            <div class="value">${confidence.toFixed(0)}%</div>
            <div class="sub"${confNote.full ? ` title="${escapeHtml(confNote.full)}"` : ''}>${confNote.text}</div>
          </div>
        </div>

        <div class="layout">
          <div class="panel">
            <h2>Recommended Actions</h2>
            <div class="recommendation-list">
              ${renderRecommendationOptions(decision.recommended_actions?.options || [])}
            </div>
            <div class="muted" style="margin-top: 16px;"><strong>Re-evaluation date:</strong> ${escapeHtml(decision.recommended_actions?.re_evaluation_date || 'TBD')}</div>
          </div>

          <div class="panel">
            <h2>Latest Financial Report</h2>
            <div class="muted"><strong>Publication date:</strong> ${escapeHtml(data.latest_financial_report?.publication_date || 'N/A')}</div>
            <div class="list" style="margin-top: 12px;">

          <div class="panel full-width">

          <div class="panel full-width">

            <h2>Decision Audit Trail</h2>

      output.innerHTML = summary;
      loadProviderHealth();
      loadAuditEvents();
    }

    function renderChartSeries(data) {
      const panel = document.getElementById('chart-panel');
      if (!panel) return;
      const series = Array.isArray(data?.chart_series) ? data.chart_series : [];
      if (!series.length) {
        panel.innerHTML = '<div class="muted">No chart history available.</div>';
        return;
      }

      const width = 760;
      const height = 220;
      const padding = 20;
      const closes = series.map((point) => Number(point.close || 0));
      const ma50 = series.map((point) => Number(point.ma_50 || 0));
      const ma100 = series.map((point) => Number(point.ma_100 || 0));
      const ma200 = series.map((point) => Number(point.ma_200 || 0));
      const minY = Math.min(...closes, ...ma50, ...ma100, ...ma200) * 0.98;
      const maxY = Math.max(...closes, ...ma50, ...ma100, ...ma200) * 1.02;
      const xStep = series.length > 1 ? (width - padding * 2) / (series.length - 1) : 0;

      const toPath = (values, offset = 0) => values.map((value, index) => {
        const x = padding + index * xStep;
        const y = height - padding - ((value - minY) / (maxY - minY || 1)) * (height - padding * 2);
        return `${index === 0 ? 'M' : 'L'} ${x} ${y + offset}`;
      }).join(' ');

      const closePath = toPath(closes);
      const ma50Path = toPath(ma50, 0);
      const ma100Path = toPath(ma100, 0);
      const ma200Path = toPath(ma200, 0);

      panel.innerHTML = `
        <svg viewBox="0 0 ${width} ${height}" width="100%" height="220" style="display:block;border-radius:8px;background:rgba(255,255,255,0.01)">
          <path d="${ma200Path}" stroke="#7a8ba8" stroke-width="1.2" fill="none" stroke-dasharray="4 4" />
          <path d="${ma100Path}" stroke="#7ce3c3" stroke-width="1.5" fill="none" />
          <path d="${ma50Path}" stroke="#5aa8ff" stroke-width="2" fill="none" />
          <path d="${closePath}" stroke="#ffbf69" stroke-width="2.2" fill="none" />
        </svg>
        <div class="chart-grid">
          <div class="mini-stat"><div class="muted">Close</div><div class="strong">${Number(data?.close ?? series.at(-1)?.close ?? 0).toFixed(2)}</div></div>
          <div class="mini-stat"><div class="muted">50d MA</div><div class="strong">${Number(data?.moving_averages?.['50d'] ?? series.at(-1)?.ma_50 ?? 0).toFixed(2)}</div></div>
          <div class="mini-stat"><div class="muted">200d MA</div><div class="strong">${Number(data?.moving_averages?.['200d'] ?? series.at(-1)?.ma_200 ?? 0).toFixed(2)}</div></div>
        </div>
      `;
    }

    function renderProviderHealth(data) {
      const entries = Object.entries(data || {});
      const panel = document.getElementById('provider-health-panel');
      if (!panel) return;
      if (!entries.length) {
        panel.innerHTML = '<div class="muted">No provider-health data available.</div>';
        return;
      }
      panel.innerHTML = entries.map(([key, value]) => {
        const healthScore = Number(value?.health_score ?? 0) * 100;
        const status = value?.status || 'unknown';
        const provider = value?.provider || key;
        return `
          <div class="health-card">
            <div class="label">${escapeHtml(key)}</div>
            <div class="metric">${healthScore.toFixed(0)}%</div>
            <div class="muted">Provider: ${escapeHtml(provider)}</div>
            <div class="muted">Status: ${escapeHtml(status)}</div>
            <div class="muted">Fallback rank: ${escapeHtml(String(value?.fallback_rank ?? 'n/a'))}</div>
          </div>
        `;
      }).join('');
    }

    function renderAuditEvents(events) {
      const panel = document.getElementById('audit-events-panel');
      if (!panel) return;
      if (!events || !events.length) {
        panel.innerHTML = '<div class="muted">No persisted audit events yet.</div>';
        return;
      }
      panel.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Ticker</th>
              <th>As of</th>
              <th>Action</th>
              <th>Score</th>
              <th>Replay</th>
            </tr>
          </thead>
          <tbody>
            ${events.slice().reverse().map((event) => `
              <tr>
                <td>${escapeHtml(event.ticker || 'N/A')}</td>
                <td>${escapeHtml(event.as_of || 'N/A')}</td>
                <td>${escapeHtml(event.action || 'N/A')}</td>
                <td>${Number(event.score ?? 0).toFixed(2)}</td>
                <td>${escapeHtml((event.replay_hash || '').slice(0, 12) || 'N/A')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    async function loadChart() {
      try {
        const ticker = (tickerInput.value || 'MSFT').trim();
        const dateValue = dateInput.value || new Date().toISOString().slice(0, 10);
        const response = await fetch(`/api/chart?ticker=${encodeURIComponent(ticker)}&date=${encodeURIComponent(dateValue)}`);
        const payload = await response.json();
        renderChartSeries(payload?.data || {});
      } catch (error) {
        const panel = document.getElementById('chart-panel');
        if (panel) panel.innerHTML = '<div class="muted">Chart data unavailable.</div>';
      }
    }

    async function loadProviderHealth() {
      try {
        const response = await fetch('/api/provider-health');
        const payload = await response.json();
        renderProviderHealth(payload?.data || {});
      } catch (error) {
        const panel = document.getElementById('provider-health-panel');
        if (panel) panel.innerHTML = '<div class="muted">Provider-health unavailable.</div>';
      }
    }

    async function loadAuditEvents() {
      try {
        const response = await fetch('/api/audit-events?limit=10');
        const payload = await response.json();
        renderAuditEvents(payload?.data || []);
      } catch (error) {
        const panel = document.getElementById('audit-events-panel');
        if (panel) panel.innerHTML = '<div class="muted">Audit view unavailable.</div>';
      }
    }

    async function loadScore() {
      const ticker = (tickerInput.value || 'MSFT').trim();
      const dateValue = dateInput.value || new Date().toISOString().slice(0, 10);
      status.textContent = `Requesting ${ticker} for ${dateValue}...`;
      output.innerHTML = '<div class="muted">Loading...</div>';

      try {
        const params = new URLSearchParams({ ticker, date: dateValue });
        const response = await fetch(`/api/score?${params.toString()}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Request failed');
        }

        status.textContent = 'Result below';
        render(data);
        await loadChart();
      } catch (error) {
        output.innerHTML = `<div class="panel"><h2>Error</h2><div class="muted">${escapeHtml(error.message || 'Request failed')}</div></div>`;
        status.textContent = 'Error';
      }
    }

    setToday();
    submitBtn.addEventListener('click', loadScore);
    tickerInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadScore();
    });
    dateInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') loadScore();
    });

    loadChart();
    loadProviderHealth();
    loadAuditEvents();
    loadScore();
  </script>
  <script>
    /* ---------------- Monitoring tab ----------------------------------------
       Filtering is SERVER SIDE. The alert store is append-only and nothing is
       ever deleted, so it only grows; shipping the whole ledger to the browser
       to filter it here would get slower every day forever.
    ------------------------------------------------------------------------ */
    const PRIORITY_CLASS = {
      'Urgent': 'p-urgent',
      'Very High': 'p-veryhigh',
      'High': 'p-high',
      'Medium': 'p-medium',
      'Low': 'p-low'
    };
    const PRIORITY_DOT = {
      'Urgent': '#ff5252',
      'Very High': '#ff9e3d',
      'High': '#ffd43b',
      'Medium': '#4dabf7',
      'Low': '#cfd8e3'
    };

    const selectedPriorities = new Set();
    let debounce = null;

    function esc(value) {
      /* Alert text includes provider headlines: untrusted input. Everything
         reaching the DOM goes through here. */
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function localTime(iso) {
      /* Stored in UTC, RENDERED in the viewer's zone, which is what the
         operator asked for. An unparseable stamp shows as-is rather than as
         "Invalid Date". */
      if (!iso) return '';
      const when = new Date(iso);
      if (isNaN(when.getTime())) return String(iso);
      return when.toLocaleString(undefined, {
        year: 'numeric', month: 'short', day: '2-digit',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function buildPriorityChips(priorities) {
      const host = document.getElementById('priorityChips');
      if (!host || host.dataset.built) return;
      host.innerHTML = (priorities || []).map(function (band) {
        return '<button class="chip" data-priority="' + esc(band) + '">' +
          '<span class="dot" style="background:' +
          esc(PRIORITY_DOT[band] || '#78889c') + '"></span>' +
          esc(band) + '</button>';
      }).join('');
      host.dataset.built = '1';
      host.querySelectorAll('.chip').forEach(function (chip) {
        chip.addEventListener('click', function () {
          const band = chip.dataset.priority;
          if (selectedPriorities.has(band)) {
            selectedPriorities.delete(band);
            chip.classList.remove('on');
          } else {
            selectedPriorities.add(band);
            chip.classList.add('on');
          }
          loadAlerts();
        });
      });
    }

    function alertCard(row) {
      /* Collapsed: priority, ticker, title, time. Expanded: the whole thing. */
      const band = PRIORITY_CLASS[row.priority] || 'p-none';
      const label = row.priority || 'Unprioritised';
      const summary = row.summary || {};
      const detail = row.detail || {};

      let body = '<dl>';
      body += '<dt>Action</dt><dd><span class="action-pill">' +
        esc(row.action || 'Review') + '</span></dd>';
      if (row.alert) body += '<dt>Detector</dt><dd>' + esc(row.alert) + '</dd>';
      if (row.state) body += '<dt>State</dt><dd>' + esc(row.state) + '</dd>';
      if (row.horizon) body += '<dt>Horizon</dt><dd>' + esc(row.horizon) + '</dd>';
      if (row.as_of) body += '<dt>As of</dt><dd>' + esc(row.as_of) + '</dd>';
      body += '<dt>Detected</dt><dd>' + esc(localTime(row.detected_at)) + '</dd>';
      body += '</dl>';

      if (summary.who || summary.what || summary.when) {
        body += '<div class="block"><dl>';
        if (summary.who) body += '<dt>Who</dt><dd>' + esc(summary.who) + '</dd>';
        if (summary.what) body += '<dt>What</dt><dd>' + esc(summary.what) + '</dd>';
        if (summary.when) body += '<dt>When</dt><dd>' + esc(summary.when) + '</dd>';
        body += '</dl></div>';
      }

      const why = summary.why;
      if (Array.isArray(why) && why.length) {
        body += '<div class="block"><dt>Why it matters</dt><ul>' +
          why.map(function (item) { return '<li>' + esc(item) + '</li>'; }).join('') +
          '</ul></div>';
      } else if (row.reason) {
        body += '<div class="block"><dt>Why it matters</dt><dd>' +
          esc(row.reason) + '</dd></div>';
      }

      /* The reasoning behind the band and the action, so the card carries the
         evidence for its own priority and nobody has to re-run the grader. */
      if (row.priority_reason) {
        body += '<div class="block"><dt>Priority basis</dt><dd class="muted">' +
          esc(row.priority_reason) + '</dd></div>';
      }
      if (row.action_reason) {
        body += '<div class="block"><dt>Action basis</dt><dd class="muted">' +
          esc(row.action_reason) + '</dd></div>';
      }
      if (detail.headline) {
        body += '<div class="block"><dt>Headline</dt><dd>' +
          esc(detail.headline) + '</dd></div>';
      }

      return '<article class="alert-card ' + band + '">' +
        '<div class="alert-head" role="button" tabindex="0">' +
          '<span class="badge">' + esc(label) + '</span>' +
          '<span class="alert-ticker">' + esc(row.ticker || '—') + '</span>' +
          '<span class="alert-title">' + esc(row.title || row.state || 'Alert') + '</span>' +
          '<span class="alert-when">' + esc(localTime(row.detected_at)) + '</span>' +
          '<span class="caret">▸</span>' +
        '</div>' +
        '<div class="alert-body">' + body + '</div>' +
      '</article>';
    }

    function renderAlerts(rows, meta) {
      const feed = document.getElementById('alertFeed');
      const status = document.getElementById('alertStatus');
      if (!feed) return;

      if (!rows.length) {
        feed.innerHTML = '<div class="empty">No alerts match these filters.' +
          '<br />Nothing is ever deleted, so widening the date range will ' +
          'always show the full history.</div>';
      } else {
        feed.innerHTML = rows.map(alertCard).join('');
        feed.querySelectorAll('.alert-head').forEach(function (head) {
          const toggle = function () {
            const card = head.parentElement;
            card.classList.toggle('open');
            const caret = head.querySelector('.caret');
            if (caret) caret.textContent = card.classList.contains('open') ? '▾' : '▸';
          };
          head.addEventListener('click', toggle);
          head.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              toggle();
            }
          });
        });
      }

      if (status) {
        const counts = (meta && meta.counts) || {};
        const parts = Object.keys(counts)
          .filter(function (key) { return counts[key] > 0; })
          .map(function (key) { return counts[key] + ' ' + key; });
        status.textContent = 'Showing ' + rows.length + ' alert(s)' +
          (parts.length ? '  ·  stored: ' + parts.join(', ') : '') +
          '  ·  times shown in your local timezone';
      }
    }

    function populateFilterOptions(meta) {
      if (!meta) return;
      buildPriorityChips(meta.priorities);

      const list = document.getElementById('tickerList');
      if (list && !list.dataset.built && meta.tickers) {
        list.innerHTML = meta.tickers.map(function (t) {
          return '<option value="' + esc(t) + '"></option>';
        }).join('');
        list.dataset.built = '1';
      }
      const types = document.getElementById('fType');
      if (types && !types.dataset.built && meta.event_types) {
        types.innerHTML = '<option value="">All event types</option>' +
          meta.event_types.map(function (t) {
            return '<option value="' + esc(t) + '">' + esc(t) + '</option>';
          }).join('');
        types.dataset.built = '1';
      }
      const badge = document.getElementById('alertCount');
      if (badge && meta.counts) {
        const total = Object.keys(meta.counts).reduce(function (sum, key) {
          return sum + meta.counts[key];
        }, 0);
        badge.textContent = total ? String(total) : '';
      }
    }

    async function loadAlerts() {
      const status = document.getElementById('alertStatus');
      const params = new URLSearchParams();
      const value = function (id) {
        const element = document.getElementById(id);
        return element ? element.value.trim() : '';
      };
      if (value('fSearch')) params.set('search', value('fSearch'));
      if (value('fTicker')) params.set('ticker', value('fTicker'));
      if (value('fType')) params.set('event_type', value('fType'));
      if (value('fStart')) params.set('start', value('fStart'));
      if (value('fEnd')) params.set('end', value('fEnd'));
      /* The viewer's own offset, so "today" in the date picker means their
         today. CAUGHT LIVE at UTC+3: filtering the local date against the UTC
         store returned 0 of 12 rows on the day the feed was populated. */
      params.set('tz', String(-new Date().getTimezoneOffset()));
      selectedPriorities.forEach(function (band) {
        params.append('priority', band);
      });

      try {
        const response = await fetch('/api/alerts?' + params.toString());
        const payload = await response.json();
        if (!payload.ok) {
          if (status) status.textContent = 'Could not load alerts: ' + payload.error;
          return;
        }
        populateFilterOptions(payload.meta);
        renderAlerts(payload.data || [], payload.meta);
      } catch (error) {
        if (status) status.textContent = 'Could not load alerts: ' + error.message;
      }
    }

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (other) {
          other.classList.toggle('active', other === tab);
        });
        const target = tab.dataset.page;
        document.querySelectorAll('.page').forEach(function (page) {
          page.classList.toggle('active', page.id === 'page-' + target);
        });
        if (target === 'monitoring') loadAlerts();
      });
    });

    ['fSearch', 'fTicker'].forEach(function (id) {
      const element = document.getElementById(id);
      if (!element) return;
      element.addEventListener('input', function () {
        /* Debounced: a keystroke per request would hammer the server while
           typing a ticker. */
        clearTimeout(debounce);
        debounce = setTimeout(loadAlerts, 250);
      });
    });
    ['fType', 'fStart', 'fEnd'].forEach(function (id) {
      const element = document.getElementById(id);
      if (element) element.addEventListener('change', loadAlerts);
    });
    const clear = document.getElementById('fClear');
    if (clear) {
      clear.addEventListener('click', function () {
        ['fSearch', 'fTicker', 'fType', 'fStart', 'fEnd'].forEach(function (id) {
          const element = document.getElementById(id);
          if (element) element.value = '';
        });
        selectedPriorities.clear();
        document.querySelectorAll('#priorityChips .chip').forEach(function (chip) {
          chip.classList.remove('on');
        });
        loadAlerts();
      });
    }

    /* Load once at startup so the tab badge shows a count before the tab is
       ever opened. */
    loadAlerts();
  </script>
</body>
</html>
